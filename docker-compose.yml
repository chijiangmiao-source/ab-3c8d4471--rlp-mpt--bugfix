services:
  web:
    build: .
    image: offline-auth-reviewer:latest
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      # Configurable host port, e.g. HOST_PORT=9090 docker compose up web
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  verify:
    image: offline-auth-reviewer:latest
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: "http://web:8080"
    command: ["python", "scripts/acceptance.py"]
    restart: "no"
